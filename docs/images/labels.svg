<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300">
<style>
.bg{fill:#fbfaf7}.card{fill:#fff;stroke:#e3e0d8;stroke-width:1.5}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;fill:#1d1d1b}
.t{font-size:17px;font-weight:700}.b{font-size:14px;fill:#55544f}.who{font-size:11px;font-weight:700;letter-spacing:.08em;fill:#8a8984}
.ico{font-size:26px}.lt{font-family:ui-monospace,Menlo,monospace;font-size:12px;font-weight:700;fill:#fff}
.arr{stroke:#9a978f;stroke-width:2;fill:none}.h{font-size:20px;font-weight:700}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9a978f"/></marker></defs>
<rect class="bg" width="960" height="300" rx="14"/>
<text class="h" x="24" y="38">Four labels tell you where every issue stands</text>
<rect x="24" y="74" width="190" height="56" rx="10" fill="#2f7d4f"/><text class="lt" x="44" y="99" style="font-size:15px">ready-for-agent</text><text class="lt" x="44" y="119" style="font-weight:400">ready to start</text>
<rect x="274" y="74" width="190" height="56" rx="10" fill="#c78a1a"/><text class="lt" x="294" y="99" style="font-size:15px">in-progress</text><text class="lt" x="294" y="119" style="font-weight:400">a worker is on it</text>
<rect x="524" y="74" width="190" height="56" rx="10" fill="#2f5d8a"/><text class="lt" x="544" y="99" style="font-size:15px">ready-for-human</text><text class="lt" x="544" y="119" style="font-weight:400">a PR awaits review</text>
<rect x="774" y="74" width="162" height="56" rx="10" fill="#6b6a66"/><text class="lt" x="794" y="99" style="font-size:15px">closed</text><text class="lt" x="794" y="119" style="font-weight:400">merged, cleaned up</text>
<rect x="274" y="214" width="190" height="56" rx="10" fill="#a3322b"/><text class="lt" x="294" y="239" style="font-size:15px">needs-human</text><text class="lt" x="294" y="259" style="font-weight:400">stopped, left a note</text>
<path class="arr" d="M214,102 L270,102" marker-end="url(#a)"/><text class="b" x="216" y="92" style="font-size:12px">claimed</text>
<path class="arr" d="M464,102 L520,102" marker-end="url(#a)"/><text class="b" x="470" y="92" style="font-size:12px">PR open</text>
<path class="arr" d="M714,102 L770,102" marker-end="url(#a)"/><text class="b" x="722" y="92" style="font-size:12px">merge</text>
<path class="arr" d="M369,130 L369,210" marker-end="url(#a)"/><text class="b" x="378" y="176" style="font-size:12px">stuck or asked</text>
<path class="arr" d="M274,242 L119,242 L119,134" marker-end="url(#a)"/><text class="b" x="130" y="232" style="font-size:12px">you answer, relabel</text>
<text class="b" x="524" y="236">Only you set <tspan style="font-weight:700;fill:#2f7d4f">ready-for-agent</tspan>.</text>
<text class="b" x="524" y="256">The orchestrator moves every other label.</text>
</svg>
