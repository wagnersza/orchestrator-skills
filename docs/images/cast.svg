<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330">
<style>
.bg{fill:#fbfaf7}.card{fill:#fff;stroke:#e3e0d8;stroke-width:1.5}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;fill:#1d1d1b}
.t{font-size:17px;font-weight:700}.b{font-size:14px;fill:#55544f}.who{font-size:11px;font-weight:700;letter-spacing:.08em;fill:#8a8984}
.ico{font-size:26px}.lt{font-family:ui-monospace,Menlo,monospace;font-size:12px;font-weight:700;fill:#fff}
.arr{stroke:#9a978f;stroke-width:2;fill:none}.h{font-size:20px;font-weight:700}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9a978f"/></marker></defs>
<rect class="bg" width="960" height="330" rx="14"/>
<text class="h" x="24" y="38">Who does what</text>
<rect class="card" x="24" y="58" width="292" height="118" rx="12"/>
<text class="ico" x="40" y="98">🧑‍💻</text>
<text class="t" x="82" y="94">You</text>
<text class="b" x="40" y="130">Pick what is ready, review the PRs,</text>
<text class="b" x="40" y="150">answer questions, say "merge".</text>
<rect class="card" x="336" y="58" width="292" height="118" rx="12"/>
<text class="ico" x="352" y="98">🎛️</text>
<text class="t" x="394" y="94">The orchestrator</text>
<text class="b" x="352" y="130">Your Claude Code chat. It takes short</text>
<text class="b" x="352" y="150">requests like "work on 42". Never codes.</text>
<rect class="card" x="648" y="58" width="292" height="118" rx="12"/>
<text class="ico" x="664" y="98">🤖</text>
<text class="t" x="706" y="94">A worker</text>
<text class="b" x="664" y="130">One AI agent on one issue, in its own</text>
<text class="b" x="664" y="150">copy of the repo. Writes code, opens a PR.</text>
<rect class="card" x="24" y="192" width="292" height="118" rx="12"/>
<text class="ico" x="40" y="232">⏱️</text>
<text class="t" x="82" y="228">The tick</text>
<text class="b" x="40" y="264">A tiny check every minute: sees who</text>
<text class="b" x="40" y="284">finished, moves labels, starts the next.</text>
<rect class="card" x="336" y="192" width="292" height="118" rx="12"/>
<text class="ico" x="352" y="232">📋</text>
<text class="t" x="394" y="228">The tracker</text>
<text class="b" x="352" y="264">GitHub, GitLab or markdown files. Each</text>
<text class="b" x="352" y="284">issue's status lives here as a label.</text>
<rect class="card" x="648" y="192" width="292" height="118" rx="12"/>
<text class="ico" x="664" y="232">🐋</text>
<text class="t" x="706" y="228">Orca</text>
<text class="b" x="664" y="264">The app the workers run in. Watch any</text>
<text class="b" x="664" y="284">worker's terminal and copy of the repo.</text>
</svg>
